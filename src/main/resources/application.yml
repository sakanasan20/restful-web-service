spring:
  application:
    name: restful-web-service
  datasource:
    driver-class-name: org.h2.Driver
    username: 'sa'
    password:
    url: 'jdbc:h2:mem:app_dev'
  h2:
    console:
      enabled: true
      path: '/h2'
  jpa:
    generate-ddl: false
    open-in-view: false
    hibernate:
      ddl-auto: update
logging:
  level:
    "[org.springframework.security]": DEBUG
    "[org.springframework.web]": DEBUG
web:
  expirationTime: 864000000
  apiLoginUrl: /api/login
  tokenSecret: token_secret_token_secret_token_secret_token_secret_token_secret_token_secret_token_secret_token_secret_token_secret_token_secret